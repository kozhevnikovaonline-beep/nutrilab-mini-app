name: Deploy Mini App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Значения задаются в Settings → Secrets and variables → Actions → Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BOT_USERNAME: ${{ vars.VITE_BOT_USERNAME }}
          VITE_APP_SHORT_NAME: ${{ vars.VITE_APP_SHORT_NAME }}
          VITE_MANAGER_USERNAME: ${{ vars.VITE_MANAGER_USERNAME }}
          VITE_CHANNEL_USERNAME: ${{ vars.VITE_CHANNEL_USERNAME }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
